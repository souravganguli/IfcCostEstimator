name: Publish Pages subpaths

on:
  workflow_run:
    workflows: [Validate Pages branch]
    types: [completed]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful validation run for the current production branch commit
        required: true
        type: string
      business_approval:
        description: Business approval reference for this production release
        required: true
        type: string

permissions:
  contents: read

jobs:
  store:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'dev') ||
      (github.event_name == 'workflow_dispatch' && github.ref_name == (vars.PRODUCTION_BRANCH || github.event.repository.default_branch))
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && 'production' || 'development-publication' }}
    permissions:
      contents: write
      actions: read
    outputs:
      directory: ${{ steps.store.outputs.directory }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify publishing identity and approval
        id: identity
        env: &publication-env
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_BRANCH: ${{ vars.PRODUCTION_BRANCH || github.event.repository.default_branch }}
          BUILD_RUN_ID: ${{ github.event.workflow_run.id || inputs.build_run_id }}
          BUSINESS_APPROVAL: ${{ inputs.business_approval }}
          ALLOW_EMPTY_PRODUCTION: ${{ vars.PAGES_ALLOW_EMPTY_PRODUCTION }}
        run: node --experimental-strip-types scripts/pages-publish.ts identity
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: incoming
          run-id: ${{ steps.identity.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Update only the selected site subpath
        id: store
        env: *publication-env
        run: node --experimental-strip-types scripts/pages-publish.ts store

  deploy:
    needs: store
    runs-on: ubuntu-latest
    concurrency:
      group: pages-combined-site
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-artifacts
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify deployed branch metadata
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          TARGET_DIRECTORY: ${{ needs.store.outputs.directory }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const directory = process.env.TARGET_DIRECTORY;
          const expected = JSON.parse(readFileSync(`${directory ? `${directory}/` : ''}_deployment.json`, 'utf8'));
          const url = `${process.env.SITE_URL.replace(/\/$/, '')}/${directory ? `${directory}/` : ''}`;
          const response = await fetch(`${url}_deployment.json`, { cache: 'no-store' });
          if (!response.ok) throw new Error('Deployed metadata is unavailable.');
          const actual = await response.json();
          if (actual.sha !== expected.sha || actual.branch !== expected.branch) throw new Error('Published revision does not match the stored deployment.');
          if (!(await fetch(url)).ok) throw new Error('Deployed entrypoint is unavailable.');
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Review URL: ${url}\n\nSource commit: ${actual.sha}\n`);
          JS
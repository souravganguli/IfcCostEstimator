<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <rect width="960" height="540" fill="#f5f5f5"/>
  <!-- tool rail -->
  <rect x="0" y="0" width="48" height="540" fill="#e0e0e0"/>
  <rect x="8" y="196" width="32" height="32" rx="4" fill="#0f6cbd"/>
  <text x="24" y="217" fill="#fff" text-anchor="middle" font-size="11">Ruler</text>
  <!-- pane -->
  <rect x="48" y="0" width="272" height="540" fill="#ffffff" stroke="#d1d1d1"/>
  <text x="64" y="32" font-size="16" font-weight="600">Measurement</text>
  <rect x="64" y="48" width="104" height="32" rx="4" fill="#0f6cbd"/>
  <text x="116" y="69" fill="#fff" text-anchor="middle">Measure (on)</text>
  <rect x="176" y="48" width="64" height="32" rx="4" fill="#fff" stroke="#8a8a8a"/>
  <text x="208" y="69" text-anchor="middle">Reset</text>
  <rect x="248" y="48" width="56" height="32" rx="4" fill="#fff" stroke="#8a8a8a"/>
  <text x="276" y="69" text-anchor="middle">Cancel</text>
  <text x="64" y="108" fill="#424242">Status (aria-live)</text>
  <rect x="64" y="116" width="240" height="28" rx="4" fill="#f0f0f0"/>
  <text x="72" y="135">Select an end point. Esc cancels.</text>
  <text x="64" y="172" fill="#424242">Result</text>
  <rect x="64" y="180" width="240" height="112" rx="4" fill="#fafafa" stroke="#e0e0e0"/>
  <text x="72" y="202">Distance       7.071 m</text>
  <text x="72" y="224">Horizontal     5.000 m</text>
  <text x="72" y="246">Vertical         5.000 m</text>
  <text x="72" y="268" fill="#616161">Snap: vertex (start), surface (end)</text>
  <text x="72" y="286" fill="#616161">Models: A.ifc (m) → A.ifc (m)</text>
  <rect x="64" y="304" width="240" height="44" rx="4" fill="#fff4ce" stroke="#f7c948"/>
  <text x="72" y="322" font-size="12">Unit unknown for B.ifc: values shown</text>
  <text x="72" y="338" font-size="12">in model units, labelled "unknown".</text>
  <text x="64" y="376" fill="#616161" font-size="12">Not survey-grade. Precision 3 dp;</text>
  <text x="64" y="392" fill="#616161" font-size="12">snap tolerance 10 px.</text>
  <!-- viewport -->
  <rect x="320" y="0" width="640" height="540" fill="#dfe6ee"/>
  <polygon points="420,420 700,420 820,330 540,330" fill="#c8ced6" stroke="#9aa3ad"/>
  <polygon points="540,330 820,330 820,150 540,150" fill="#d6dbe1" stroke="#9aa3ad"/>
  <polygon points="420,420 540,330 540,150 420,240" fill="#bfc6cf" stroke="#9aa3ad"/>
  <!-- measurement overlay -->
  <line x1="540" y1="330" x2="760" y2="190" stroke="#c50f1f" stroke-width="3"/>
  <line x1="540" y1="330" x2="760" y2="330" stroke="#0f6cbd" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="760" y1="330" x2="760" y2="190" stroke="#107c10" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="540" cy="330" r="6" fill="#fff" stroke="#c50f1f" stroke-width="3"/>
  <circle cx="760" cy="190" r="6" fill="#fff" stroke="#c50f1f" stroke-width="3"/>
  <rect x="610" y="232" width="84" height="22" rx="3" fill="#ffffff" stroke="#c50f1f"/>
  <text x="652" y="248" text-anchor="middle">7.071 m</text>
  <rect x="616" y="336" width="72" height="20" rx="3" fill="#ffffff" stroke="#0f6cbd"/>
  <text x="652" y="351" text-anchor="middle" font-size="12">H 5.000</text>
  <rect x="768" y="248" width="64" height="20" rx="3" fill="#ffffff" stroke="#107c10"/>
  <text x="800" y="263" text-anchor="middle" font-size="12">V 5.000</text>
  <!-- snap cursor -->
  <rect x="752" y="182" width="16" height="16" fill="none" stroke="#c50f1f" stroke-width="2"/>
  <text x="776" y="178" font-size="12" fill="#c50f1f">vertex snap</text>
  <text x="336" y="524" fill="#424242" font-size="12">Overlay drawn on top of geometry; distinct colours for 3D / horizontal / vertical legs. Crosshair cursor while tool active.</text>
</svg>

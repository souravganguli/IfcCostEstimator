<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" font-family="Segoe UI, Arial, sans-serif" font-size="13">
<rect width="760" height="440" fill="#ffffff" stroke="#8a8886"/>
<text x="16" y="30" font-size="16" font-weight="bold" fill="#201f1e">Navisworks — Saved Viewpoints window (help.autodesk.com)</text>
<text x="16" y="52" font-size="11" fill="#605e5c">Reference still of documented behaviour (help.autodesk.com NAV, "saved viewpoints")</text>
<rect x="16" y="66" width="728" height="358" fill="#f3f2f1" stroke="#e1dfdd"/>
<text x="28" y="92" font-weight="bold" fill="#201f1e">Saved Viewpoints</text>
<text x="28" y="120" fill="#323130">▾ 📁 Level 01 (folder)</text>
<rect x="44" y="130" width="300" height="26" fill="#ffffff" stroke="#c8c6c4"/><text x="54" y="148" fill="#323130">▦ Entry — camera + section</text>
<rect x="44" y="160" width="300" height="26" fill="#eff6fc" stroke="#0078d4"/><text x="54" y="178" fill="#201f1e">▦ MEP isolate — hide + material</text>
<text x="28" y="212" fill="#323130">▾ 📁 Structure (folder)</text>
<rect x="44" y="222" width="300" height="26" fill="#ffffff" stroke="#c8c6c4"/><text x="54" y="240" fill="#323130">▦ Grid A section</text>
<rect x="380" y="120" width="348" height="140" fill="#ffffff" stroke="#c8c6c4"/>
<text x="392" y="142" font-weight="bold" fill="#201f1e">Saved Attributes (per viewpoint)</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <rect x="0" y="0" width="1000" height="620" fill="#faf9f8" stroke="#8a8886"/>
  <!-- Top ribbon -->
  <rect x="0" y="0" width="1000" height="22" fill="#f3f2f1" stroke="#e1dfdd"/>
  <text x="8" y="15" fill="#323130">Open  |  View  |  Settings</text>
  <!-- Tool rail -->
  <rect x="0" y="22" width="40" height="598" fill="#f3f2f1" stroke="#e1dfdd"/>
  <rect x="6" y="150" width="28" height="28" fill="#0078d4" rx="4"/>
  <text x="11" y="169" fill="#ffffff">SV</text>
  <text x="2" y="195" fill="#605e5c" font-size="9">Saved Views</text>
  <!-- Left pane: Saved Views library -->
  <rect x="40" y="22" width="230" height="598" fill="#ffffff" stroke="#e1dfdd"/>
  <text x="52" y="44" fill="#201f1e" font-weight="bold">Saved Views</text>
  <rect x="52" y="54" width="120" height="24" fill="#0078d4" rx="4"/>
  <text x="62" y="70" fill="#ffffff">+ Save current view</text>
  <rect x="180" y="54" width="36" height="24" fill="#edebe9" rx="4" stroke="#c8c6c4"/>
  <text x="186" y="70" fill="#323130">Imp</text>
  <rect x="220" y="54" width="36" height="24" fill="#edebe9" rx="4" stroke="#c8c6c4"/>
  <text x="226" y="70" fill="#323130">Exp</text>
  <!-- Folder -->
  <text x="54" y="100" fill="#323130">▾ Level 1</text>
  <rect x="60" y="108" width="200" height="46" fill="#f3f2f1" stroke="#e1dfdd"/>
  <rect x="66" y="114" width="54" height="34" fill="#c8c6c4"/>
  <text x="128" y="128" fill="#201f1e">Entry lobby</text>
  <text x="128" y="144" fill="#605e5c" font-size="10">persp · clip · 2 colors</text>
  <rect x="60" y="158" width="200" height="46" fill="#ffffff" stroke="#e1dfdd"/>
  <rect x="66" y="164" width="54" height="34" fill="#c8c6c4"/>
  <text x="128" y="178" fill="#201f1e">MEP coordination</text>
  <text x="128" y="194" fill="#605e5c" font-size="10">ortho · isolate · clip</text>
  <text x="54" y="228" fill="#323130">▾ Structure</text>
  <rect x="60" y="236" width="200" height="46" fill="#ffffff" stroke="#e1dfdd"/>
  <rect x="66" y="242" width="54" height="34" fill="#c8c6c4"/>
  <text x="128" y="256" fill="#201f1e">Grid A section</text>
  <text x="128" y="272" fill="#605e5c" font-size="10">ortho · clip</text>
  <!-- Viewport area with tab strip -->
  <rect x="270" y="22" width="730" height="24" fill="#f3f2f1" stroke="#e1dfdd"/>
  <rect x="274" y="24" width="150" height="20" fill="#ffffff" stroke="#0078d4"/>
  <text x="282" y="39" fill="#201f1e">Entry lobby ✎</text>
  <text x="408" y="39" fill="#605e5c">×</text>
  <rect x="426" y="24" width="150" height="20" fill="#edebe9" stroke="#e1dfdd"/>
  <text x="434" y="39" fill="#323130">MEP coordination*</text>
  <text x="560" y="39" fill="#605e5c">×</text>
  <rect x="578" y="24" width="30" height="20" fill="#edebe9" stroke="#e1dfdd"/>
  <text x="588" y="39" fill="#323130">+</text>
  <text x="620" y="39" fill="#605e5c" font-size="10">* = unsaved changes</text>
  <!-- 3D canvas -->
  <rect x="270" y="46" width="730" height="574" fill="#e8e6e4" stroke="#e1dfdd"/>
  <text x="560" y="330" fill="#605e5c">Single shared 3D canvas (one WebGL context)</text>
  <text x="520" y="350" fill="#605e5c">Active tab's snapshot: camera + clip + color + visibility</text>
  <!-- view cube -->
  <rect x="930" y="56" width="56" height="56" fill="#ffffff" stroke="#8a8886"/>
  <text x="946" y="88" fill="#323130" font-size="10">cube</text>
</svg>

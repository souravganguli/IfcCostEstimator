<svg xmlns="http://www.w3.org/2000/svg" width="360" height="430" viewBox="0 0 360 430" font-family="Segoe UI, system-ui, sans-serif" font-size="12">
  <style>
    .pane{fill:#fff;stroke:#d1d1d1}
    .hdr{font-weight:600;font-size:14px;fill:#242424}
    .row{fill:#fff}
    .rowh{fill:#f5f5f5}
    .lbl{fill:#242424}
    .dim{fill:#9e9e9e}
    .chev{fill:#616161}
    .ico{fill:#616161}
    .act{fill:#616161}
    .count{fill:#616161}
    .input{fill:#fff;stroke:#c7c7c7}
    .ph{fill:#9e9e9e}
    .sep{stroke:#ededed}
  </style>
  <rect x="0.5" y="0.5" width="359" height="429" class="pane"/>
  <!-- pane title -->
  <text x="12" y="24" class="hdr">Levels and hierarchy</text>
  <line x1="0" y1="34" x2="360" y2="34" class="sep"/>
  <!-- toolbar: filter + show all -->
  <rect x="12" y="44" width="230" height="26" rx="4" class="input"/>
  <text x="22" y="61" class="ph">Filter tree…</text>
  <rect x="250" y="44" width="98" height="26" rx="4" class="input"/>
  <text x="262" y="61" class="lbl">Show all (0)</text>
  <line x1="0" y1="82" x2="360" y2="82" class="sep"/>

  <!-- model root -->
  <rect x="0" y="86" width="360" height="26" class="rowh"/>
  <text x="14" y="103" class="chev">▾</text>
  <text x="30" y="103" class="ico">▣</text>
  <text x="48" y="103" class="lbl" font-weight="600">Duplex_Architecture.ifc</text>

  <!-- storey (expanded) -->
  <rect x="0" y="112" width="360" height="26" class="row"/>
  <text x="34" y="129" class="chev">▾</text>
  <text x="50" y="129" class="ico">▤</text>
  <text x="68" y="129" class="lbl">Level 1</text>
  <text x="300" y="129" class="act">⊘</text>  <!-- isolate on hover -->
  <text x="322" y="129" class="act">👁</text> <!-- hide on hover -->

  <!-- element visible -->
  <rect x="0" y="138" width="360" height="26" class="row"/>
  <text x="54" y="155" class="ico">▢</text>
  <text x="72" y="155" class="lbl">M_Sofa:1830mm (168377)</text>
  <text x="322" y="155" class="act">👁</text>

  <!-- element visible -->
  <rect x="0" y="164" width="360" height="26" class="row"/>
  <text x="54" y="181" class="ico">▢</text>
  <text x="72" y="181" class="lbl">M_Table-Coffee (168379)</text>
  <text x="322" y="181" class="act">👁</text>

  <!-- element HIDDEN (dimmed + hidden icon) -->
  <rect x="0" y="190" width="360" height="26" class="row"/>
  <text x="54" y="207" class="dim">▢</text>
  <text x="72" y="207" class="dim">M_Table-Coffee (168380)</text>
  <text x="300" y="207" class="dim">🚫</text> <!-- hidden badge -->
  <text x="322" y="207" class="act">◍</text>  <!-- show/unhide -->

  <!-- storey collapsed with mixed state -->
  <rect x="0" y="216" width="360" height="26" class="row"/>
  <text x="34" y="233" class="chev">▸</text>
  <text x="50" y="233" class="ico">▤</text>
  <text x="68" y="233" class="lbl">Level 2</text>
  <text x="152" y="233" class="dim" font-size="11">partly hidden</text>

  <line x1="0" y1="250" x2="360" y2="250" class="sep"/>

  <!-- legend -->
  <text x="12" y="276" class="hdr" font-size="12">Legend</text>
  <text x="12" y="298" class="chev">▾ ▸</text><text x="44" y="298" class="lbl">expand / collapse</text>
  <text x="12" y="318" class="act">⊘</text><text x="44" y="318" class="lbl">isolate (spatial nodes)</text>
  <text x="12" y="338" class="act">👁</text><text x="44" y="338" class="lbl">hide (visible row, on hover/focus)</text>
  <text x="12" y="358" class="act">◍</text><text x="44" y="358" class="lbl">show / unhide (hidden row)</text>
  <text x="12" y="378" class="dim">dimmed + 🚫</text><text x="98" y="378" class="lbl">hidden element state</text>
  <text x="12" y="398" class="dim">partly hidden</text><text x="98" y="398" class="lbl">mixed descendant state on parent</text>
  <text x="12" y="418" class="count">Show all (n)</text><text x="98" y="418" class="lbl">n = count of hierarchy-hidden elements</text>
</svg>

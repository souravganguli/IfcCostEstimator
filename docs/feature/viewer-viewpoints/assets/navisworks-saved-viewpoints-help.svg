<text x="392" y="190" fill="#323130">☑ Override Material</text>
<text x="392" y="220" font-size="11" fill="#605e5c">Right-click → Export Viewpoints (XML)</text>
<text x="392" y="238" font-size="11" fill="#605e5c">Recall / Edit / Rename / Delete / Folders</text>
<text x="28" y="300" font-size="12" fill="#a4262c">Known issue: hidden elements reappear &amp; overrides reset</text>
<text x="28" y="318" font-size="12" fill="#a4262c">when switching viewpoints if attributes not saved.</text>
<text x="28" y="348" font-size="11" fill="#605e5c">Camera + cross-sections always saved; visibility/material captured only</text>
<text x="28" y="366" font-size="11" fill="#605e5c">when the corresponding Saved Attributes are enabled.</text>

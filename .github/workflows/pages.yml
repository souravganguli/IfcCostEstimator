name: Test and deploy Phase 0

on:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Chrome
        run: npx playwright install --with-deps chrome
      - run: npm run test
      - run: npm run build
      - name: Test built site in Chrome
        env:
          TEST_SERVER: preview
        run: npm run test:e2e
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify deployed entry point and application asset
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node --input-type=module <<'JS'
          const siteUrl = process.env.SITE_URL;
          if (!siteUrl) throw new Error('GitHub Pages did not provide a deployment URL.');

          const response = await fetch(siteUrl, { cache: 'no-store' });
          if (!response.ok) throw new Error(`Deployed entry point returned HTTP ${response.status}.`);
          const html = await response.text();
          const assetPath = html.match(/(?:src|href)="([^"]+\/assets\/[^"]+\.(?:js|css))"/)?.[1];
          if (!assetPath) throw new Error('Deployed entry point does not reference a built application asset.');

          const asset = await fetch(new URL(assetPath, siteUrl), { cache: 'no-store' });
          if (!asset.ok) throw new Error(`Deployed application asset returned HTTP ${asset.status}.`);
          console.log(`Verified deployed entry point and asset: ${siteUrl}`);
          JS
